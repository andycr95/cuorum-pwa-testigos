version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Versión de pnpm: la de packageManager del package.json (CUO-1866).
        - corepack enable
        - COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack install
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
  # PWA Configuration
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: 'index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache'
    - pattern: 'sw.js'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache'
    - pattern: 'registerSW.js'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache'
    - pattern: 'manifest.webmanifest'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache'
        - key: 'Content-Type'
          value: 'application/manifest+json'
